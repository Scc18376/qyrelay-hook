name: Probe runner capability

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  probe-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: hello
        run: |
          echo "ubuntu runner OK"
          uname -a
          which clang || true
  probe-macos:
    runs-on: macos-14
    steps:
      - name: hello
        run: |
          echo "macos runner OK"
          sw_vers
          xcodebuild -version
