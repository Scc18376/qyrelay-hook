name: Build dylib on Linux

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'QyRelayHook.m'
      - '.github/workflows/linuxbuild.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libblocksruntime-dev || true
          echo "clang: $(clang --version | head -1)"
          ls /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null || which ld64.lld || true

      - name: Fetch iPhoneOS SDK
        run: |
          mkdir -p $HOME/sdk && cd $HOME/sdk
          curl -sL -o sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -w 'download http=%{http_code} bytes=%{size_download}\n'
          tar xf sdk.tar.xz
          ls -d *.sdk
          echo "--- objc headers ---"
          ls $HOME/sdk/iPhoneOS16.5.sdk/usr/include/objc 2>/dev/null | head -5 || echo "no objc headers"
          echo "--- frameworks ---"
          ls $HOME/sdk/iPhoneOS16.5.sdk/System/Library/Frameworks/Foundation.framework 2>/dev/null | head -3 || echo "no Foundation"
          ls $HOME/sdk/iPhoneOS16.5.sdk/System/Library/Frameworks/UIKit.framework 2>/dev/null | head -3 || echo "no UIKit"
          echo "--- libSystem ---"
          ls $HOME/sdk/iPhoneOS16.5.sdk/usr/lib/libSystem.tbd 2>/dev/null || echo "no libSystem.tbd"

      - name: Compile dylib
        run: |
          SDK=$HOME/sdk/iPhoneOS16.5.sdk
          echo "=== 开始编译 ==="
          clang -arch arm64 \
                -target arm64-apple-ios15.0 \
                -isysroot "$SDK" \
                -dynamiclib \
                -fobjc-arc \
                -fblocks \
                -O2 \
                -I"$SDK/usr/include" \
                -F"$SDK/System/Library/Frameworks" \
                -framework Foundation \
                -framework UIKit \
                -o QyRelayHook.dylib \
                QyRelayHook.m 2>&1 | head -50 || true
          echo "=== 结果 ==="
          if [ -f QyRelayHook.dylib ]; then
            file QyRelayHook.dylib
            ls -lh QyRelayHook.dylib
          else
            echo "编译失败，无产物"
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            QyRelayHook.dylib
          if-no-files-found: warn
